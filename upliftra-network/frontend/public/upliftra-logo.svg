<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 380" width="100%" height="100%">
  <defs>
    <!-- Gradients for UN Monogram -->
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#0052CC" />
      <stop offset="100%" stop-color="#002D72" />
    </linearGradient>
    
    <linearGradient id="blueSwoosh" x1="0%" y1="50%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0044B2" />
      <stop offset="40%" stop-color="#0077FF" />
      <stop offset="85%" stop-color="#00C0FF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <linearGradient id="silverBevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="55%" stop-color="#94A3B8" />
      <stop offset="85%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="50%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <linearGradient id="textChrome" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077FF" />
      <stop offset="100%" stop-color="#0044B2" />
    </linearGradient>

    <radialGradient id="orbGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="30%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </radialGradient>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Group for Monogram Icon -->
  <g transform="translate(145, 15)" filter="url(#dropShadow)">
    <!-- Metallic N Letter (Right Side) -->
    <!-- Left vertical bar of N -->
    <path d="M125 15 L175 15 L175 160 L125 160 Z" fill="url(#silverBevel)" stroke="#334155" stroke-width="1.5" />
    <path d="M125 15 L145 15 L145 160 L125 160 Z" fill="#FFFFFF" fill-opacity="0.5" />
    
    <!-- Diagonal bar of N -->
    <path d="M145 25 L245 155 L285 155 L175 15 Z" fill="url(#silverDark)" stroke="#334155" stroke-width="1.5" />
    <path d="M175 15 L285 155 L265 155 L165 25 Z" fill="#FFFFFF" fill-opacity="0.3" />

    <!-- Right vertical bar of N -->
    <path d="M235 15 L285 15 L285 160 L235 160 Z" fill="url(#silverBevel)" stroke="#334155" stroke-width="1.5" />
    <path d="M270 15 L285 15 L285 160 L270 160 Z" fill="#334155" fill-opacity="0.6" />

    <!-- 3D Electric Blue U Letter (Left Side & Front) -->
    <!-- Left arm of U -->
    <path d="M45 15 L95 15 L95 110 C95 145 125 160 155 160 C185 160 215 145 215 110 L215 70 L260 70 L260 110 C260 165 215 195 155 195 C95 195 45 165 45 110 Z" fill="url(#blueGlow)" stroke="#003388" stroke-width="2" />
    
    <!-- Highlights and bevels on U -->
    <path d="M45 15 L60 15 L60 110 C60 150 95 178 140 185 L135 194 C85 185 45 150 45 110 Z" fill="#67E8F9" fill-opacity="0.5" />
    <path d="M75 15 L95 15 L95 110 C95 130 115 145 145 145 L145 135 C120 135 105 125 105 110 L105 15 Z" fill="#002D72" fill-opacity="0.6" />

    <!-- Left Outer Swoosh wrap around U base -->
    <path d="M15 135 C20 175 65 210 135 210 C195 210 245 180 270 140 C280 125 290 100 300 70 C310 45 320 28 335 18 C315 28 295 55 280 85 C255 135 210 180 145 180 C85 180 40 150 30 120 Z" fill="url(#blueSwoosh)" />
    
    <!-- Top Cyan Orbit Trail & Orb -->
    <path d="M240 70 C270 50 310 32 355 22" stroke="url(#blueSwoosh)" stroke-width="4.5" stroke-linecap="round" fill="none" />
    <circle cx="362" cy="20" r="10" fill="url(#orbGlow)" filter="url(#dropShadow)" />
    <circle cx="360" cy="18" r="3.5" fill="#FFFFFF" />
  </g>

  <!-- Wordmark "UPLIFTRA" -->
  <g transform="translate(0, 290)">
    <text x="350" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="7" fill="url(#textChrome)">
      UPLIFTR<tspan fill="url(#blueAccent)">A</tspan>
    </text>
    
    <!-- Stylized Arrow/Triangle inside A -->
    <path d="M485 -22 L497 -3 L473 -3 Z" fill="url(#blueAccent)" />
  </g>

  <!-- Subtitle "— NETWORK —" -->
  <g transform="translate(0, 328)">
    <!-- Left horizontal rule line -->
    <line x1="160" y1="-8" x2="250" y2="-8" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- NETWORK text -->
    <text x="350" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="11" fill="#0055D4">
      NETWORK
    </text>
    
    <!-- Right horizontal rule line -->
    <line x1="450" y1="-8" x2="540" y2="-8" stroke="#0066FF" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
